name: kamal-previews / sweep
description: |
  Reconciles registered preview environments against open pull requests
  and tears down orphans (closed / deleted PRs whose teardown event was
  missed). Designed to run from a scheduled (cron) workflow.

  Usage:

      on:
        schedule:
          - cron: "0 6 * * *"
      jobs:
        sweep:
          runs-on: ubuntu-latest
          permissions:
            contents: read
            pull-requests: read
            deployments: write
          steps:
            - uses: actions/checkout@v4
            # Optional: VPN, if your deploy host is private.
            - uses: <your-vpn-action>@v1
              with: { private-key: ..., public-key: ..., endpoint: ..., interface-ip: ..., routes: ... }
            - uses: web-ascender/github-actions-kamal-previews/sweep@v1
              with:
                base-deploy-file:  config/deploy.staging.yml
                base-secrets-file: .kamal/secrets.staging
                domain-suffix:     preview.example.com
                deploy-host:       staging.example.com
                database-engine:   postgres
                databases: |
                  DATABASE_URL=myapp_staging:myapp_{db_slug}
              env:
                # Forwarded from `secrets.*` in the calling workflow:
                SSH_PRIVATE_KEY:  <your DEPLOY_SSH_KEY secret>
                RAILS_MASTER_KEY: <your STAGING_MASTER_KEY secret>

  Orphans are processed sequentially — for a handful of stale previews per
  day, this is fine. Adopters who genuinely need parallel cleanup of many
  orphans should use the reusable-workflow form
  (`web-ascender/github-actions-kamal-previews/.github/workflows/sweep.yml@v1`), which
  uses a matrix to fan out.

inputs:
  base-deploy-file:           { required: true }
  domain-suffix:              { required: true }
  deploy-host:                { required: true }
  database-engine:            { required: false, default: none }
  databases:                  { required: false, default: "" }
  database-admin-url-var:     { required: false, default: "DATABASE_URL" }
  sqlite-target-path-pattern: { required: false, default: "" }
  sqlite-also-clone:          { required: false, default: "" }
  base-secrets-file:          { required: false, default: "" }
  domain-label-pattern:       { required: false, default: "{slug}" }
  service-pattern:            { required: false, default: "{base_service}-{slug}" }
  destination-pattern:        { required: false, default: "{slug}" }
  env-label:                  { required: false, default: preview }
  prefix-strip:               { required: false, default: "feature/,feat/,fix/,bug/,bugfix/,chore/,hotfix/,release/" }
  ruby-version:               { required: false, default: "3.3" }
  kamal-version:              { required: false, default: "" }
  bundler-cache:              { required: false, default: "true" }
  ssh-user:                   { required: false, default: deploy }
  ssh-port:                   { required: false, default: "22" }
  environment-prefix:         { required: false, default: "preview-" }
  dry-run:                    { required: false, default: "false" }

runs:
  using: composite
  steps:
    - id: kp_meta
      shell: bash
      env:
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        repo="${ACTION_REPO:-web-ascender/github-actions-kamal-previews}"
        ref="${ACTION_REF:-main}"
        echo "repo=$repo" >> "$GITHUB_OUTPUT"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v4
      with:
        repository: ${{ steps.kp_meta.outputs.repo }}
        ref: ${{ steps.kp_meta.outputs.ref }}
        path: .kamal-previews

    - uses: ./.kamal-previews/.github/actions/setup
      with:
        ruby-version: ${{ inputs.ruby-version }}
        kamal-version: ${{ inputs.kamal-version }}
        bundler-cache: ${{ inputs.bundler-cache }}
        ssh-private-key: ${{ env.SSH_PRIVATE_KEY }}
        setup-buildx: "false"
        setup-gha-cache: "false"

    - id: identify
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        ENV_PREFIX: ${{ inputs.environment-prefix }}
        PREFIX_STRIP: ${{ inputs.prefix-strip }}
      run: |
        set -euo pipefail
        mapfile -t open_branches < <(gh pr list --repo "$GH_REPO" --state open --json headRefName --jq '.[].headRefName')
        mapfile -t envs < <(
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GH_REPO/environments" --paginate \
            --jq '.environments[]?.name // .[]?.name' \
            | grep -E "^${ENV_PREFIX}" || true
        )

        # Build a regex of prefixes to strip (matching kamal-previews' Namer).
        prefix_re="$(echo "$PREFIX_STRIP" | tr ',' '|' | sed 's:/$::; s:/|:|:g; s:/$::')"
        slugify() {
          echo "$1" | tr '[:upper:]' '[:lower:]' \
            | sed -E "s|^(${prefix_re})/||" \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//'
        }

        orphans=()
        for env in "${envs[@]}"; do
          deployment_id="$(gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GH_REPO/deployments?environment=${env}&per_page=1" \
            --jq '.[0].id // empty' || true)"
          [ -z "$deployment_id" ] && continue
          state="$(gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GH_REPO/deployments/${deployment_id}/statuses?per_page=1" \
            --jq '.[0].state // empty' || true)"
          case "$state" in
            ""|inactive|removed|failure|error) continue ;;
          esac

          slug="${env#${ENV_PREFIX}}"
          matched=0
          for branch in "${open_branches[@]}"; do
            if [ "$(slugify "$branch")" = "$slug" ]; then matched=1; break; fi
          done
          if [ "$matched" = "0" ]; then
            echo "::notice::Orphan: $env (slug=$slug)"
            orphans+=("$slug")
          fi
        done

        if [ ${#orphans[@]} -eq 0 ]; then
          echo "No orphans found."
          echo "orphan_count=0" >> "$GITHUB_OUTPUT"
        else
          printf '%s\n' "${orphans[@]}" > orphans.txt
          echo "orphan_count=${#orphans[@]}" >> "$GITHUB_OUTPUT"
        fi

    - id: db_admin_url
      if: steps.identify.outputs.orphan_count != '0' && (inputs.database-engine == 'postgres' || inputs.database-engine == 'mysql')
      shell: bash
      env:
        EXPLICIT_URL: ${{ env.DATABASE_ADMIN_URL }}
        BASE_SECRETS_FILE: ${{ inputs.base-secrets-file }}
        VAR_NAME: ${{ inputs.database-admin-url-var }}
      run: |
        set -euo pipefail
        url=""
        if [ -n "${EXPLICIT_URL:-}" ]; then
          url="$EXPLICIT_URL"
        elif [ -n "$BASE_SECRETS_FILE" ] && [ -f "$BASE_SECRETS_FILE" ]; then
          url="$(set -a; . "$BASE_SECRETS_FILE"; set +a; printf '%s' "${!VAR_NAME-}")"
        fi
        if [ -z "$url" ]; then
          echo "::error::Could not resolve a database admin URL for sweep teardown."; exit 1
        fi
        echo "::add-mask::$url"
        echo "KAMAL_PREVIEWS_DB_ADMIN_URL=$url" >> "$GITHUB_ENV"

    - id: teardown
      if: steps.identify.outputs.orphan_count != '0'
      shell: bash
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        BASE_DEPLOY_FILE:           ${{ inputs.base-deploy-file }}
        BASE_SECRETS_FILE:          ${{ inputs.base-secrets-file }}
        DOMAIN_SUFFIX:              ${{ inputs.domain-suffix }}
        DOMAIN_LABEL_PATTERN:       ${{ inputs.domain-label-pattern }}
        SERVICE_PATTERN:            ${{ inputs.service-pattern }}
        DESTINATION_PATTERN:        ${{ inputs.destination-pattern }}
        DATABASES:                  ${{ inputs.databases }}
        ENV_LABEL:                  ${{ inputs.env-label }}
        PREFIX_STRIP:               ${{ inputs.prefix-strip }}
        DATABASE_ENGINE:            ${{ inputs.database-engine }}
        DEPLOY_HOST:                ${{ inputs.deploy-host }}
        SSH_USER:                   ${{ inputs.ssh-user }}
        SSH_PORT:                   ${{ inputs.ssh-port }}
        SQLITE_PATTERN:             ${{ inputs.sqlite-target-path-pattern }}
        SQLITE_ALSO:                ${{ inputs.sqlite-also-clone }}
        ENV_PREFIX:                 ${{ inputs.environment-prefix }}
      run: |
        set -euo pipefail
        if [ "$DRY_RUN" = "true" ]; then
          echo "::notice::DRY RUN — these orphans would be torn down:"
          cat orphans.txt
          exit 0
        fi
        # Composite actions can't loop with `uses:` calls per iteration, so
        # we re-implement the teardown body here. For each orphan slug:
        # generate the per-PR config (to learn destination + resolved DB
        # targets), `kamal app remove`, drop each database, mark the
        # GitHub deployment inactive.
        if [ "$DATABASE_ENGINE" = "postgres" ] || [ "$DATABASE_ENGINE" = "mysql" ]; then
          # shellcheck source=../.github/actions/lib/parse-db-url.sh
          source "$(pwd)/.kamal-previews/.github/actions/lib/parse-db-url.sh"
          kp_parse_db_url "$KAMAL_PREVIEWS_DB_ADMIN_URL"
        fi

        while IFS= read -r slug; do
          echo "::group::Teardown for slug=$slug"

          gen_args=(
            generate
            --branch "$slug"
            --base-deploy-file "$BASE_DEPLOY_FILE"
            --domain-suffix "$DOMAIN_SUFFIX"
            --domain-label-pattern "$DOMAIN_LABEL_PATTERN"
            --service-pattern "$SERVICE_PATTERN"
            --destination-pattern "$DESTINATION_PATTERN"
            --env-label "$ENV_LABEL"
            --prefix-strip "$PREFIX_STRIP"
          )
          [ -n "$BASE_SECRETS_FILE" ] && gen_args+=(--base-secrets-file "$BASE_SECRETS_FILE")
          if [ -n "$DATABASES" ]; then
            while IFS= read -r line; do
              stripped="${line#"${line%%[![:space:]]*}"}"
              stripped="${stripped%"${stripped##*[![:space:]]}"}"
              [ -z "$stripped" ] && continue
              case "$stripped" in \#*) continue ;; esac
              gen_args+=(--database "$stripped")
            done <<< "$DATABASES"
          fi

          summary="$(.kamal-previews/bin/kamal-previews "${gen_args[@]}")"
          dest="$(echo "$summary" | jq -r '.destination')"
          db_slug="$(echo "$summary" | jq -r '.db_slug')"
          databases_resolved="$(echo "$summary" | jq -r '.databases_resolved // empty')"

          # kamal app remove
          kamal lock release -d "$dest" || true
          if ! kamal app remove -d "$dest" -y; then
            echo "::warning::kamal app remove -d $dest exited non-zero — assuming already gone."
          fi

          # drop databases (if applicable)
          if [ "$DATABASE_ENGINE" != "none" ]; then
            scripts_dir="$(pwd)/.kamal-previews/scripts"
            ssh_target="${SSH_USER}@${DEPLOY_HOST}"
            ssh_opts=(-o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
            scp_opts=(-o StrictHostKeyChecking=accept-new -P "$SSH_PORT")
            remote="$(ssh "${ssh_opts[@]}" "$ssh_target" 'mktemp -d')"
            scp "${scp_opts[@]}" -r "$scripts_dir/lib" "$ssh_target:$remote/"
            scp "${scp_opts[@]}" -r "$scripts_dir/$DATABASE_ENGINE" "$ssh_target:$remote/"

            case "$DATABASE_ENGINE" in
              postgres|mysql)
                while IFS= read -r entry; do
                  [ -z "$entry" ] && continue
                  rest="${entry#*=}"
                  tgt="${rest#*:}"
                  [ -z "$tgt" ] && continue
                  envfile="$(mktemp)"
                  case "$DATABASE_ENGINE" in
                    postgres)
                      {
                        printf 'PGHOST=%s\nPGPORT=%s\nPGUSER=%s\nPGPASSWORD=%s\n' \
                          "$KP_DB_HOST" "${KP_DB_PORT:-5432}" "$KP_DB_USER" "$KP_DB_PASSWORD"
                        [ -n "${KP_DB_SSLMODE:-}" ] && printf 'PGSSLMODE=%s\n' "$KP_DB_SSLMODE"
                        [ -n "${KP_DB_DBNAME:-}" ] && printf 'MAINTENANCE_DATABASE=%s\n' "$KP_DB_DBNAME"
                        printf 'TARGET_DATABASE=%s\n' "$tgt"
                      } > "$envfile"
                      scp "${scp_opts[@]}" "$envfile" "$ssh_target:$remote/.env"
                      ssh "${ssh_opts[@]}" "$ssh_target" \
                        "docker run --rm --env-file '$remote/.env' --network host -v '$remote:/work:ro' postgres:alpine bash /work/postgres/drop.sh"
                      ;;
                    mysql)
                      {
                        printf 'MYSQL_HOST=%s\nMYSQL_PORT=%s\nMYSQL_USER=%s\nMYSQL_PASSWORD=%s\n' \
                          "$KP_DB_HOST" "${KP_DB_PORT:-3306}" "$KP_DB_USER" "$KP_DB_PASSWORD"
                        [ -n "${KP_DB_SSL_MODE:-}" ] && printf 'MYSQL_SSL_MODE=%s\n' "$KP_DB_SSL_MODE"
                        printf 'TARGET_DATABASE=%s\n' "$tgt"
                      } > "$envfile"
                      scp "${scp_opts[@]}" "$envfile" "$ssh_target:$remote/.env"
                      ssh "${ssh_opts[@]}" "$ssh_target" \
                        "docker run --rm --env-file '$remote/.env' --network host -v '$remote:/work:ro' mysql:8.4 bash /work/mysql/drop.sh"
                      ;;
                  esac
                  rm -f "$envfile"
                done <<< "$databases_resolved"
                ;;
              sqlite)
                resolved="${SQLITE_PATTERN//\{slug\}/$slug}"
                resolved="${resolved//\{db_slug\}/$db_slug}"
                envfile="$(mktemp)"
                {
                  printf 'TARGET_PATH=%s\n' "$resolved"
                  [ -n "${SQLITE_ALSO:-}" ] && printf 'ALSO_DROP=%s\n' "$SQLITE_ALSO"
                } > "$envfile"
                scp "${scp_opts[@]}" "$envfile" "$ssh_target:$remote/.env"
                rm -f "$envfile"
                ssh "${ssh_opts[@]}" "$ssh_target" \
                  "set -a && . '$remote/.env' && set +a && bash '$remote/sqlite/drop.sh'"
                ;;
            esac
            ssh "${ssh_opts[@]}" "$ssh_target" "rm -rf '$remote'" || true
          fi

          # mark deployment inactive
          deployment_id="$(gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/deployments?environment=${ENV_PREFIX}${slug}&per_page=1" \
            --jq '.[0].id // empty' || true)"
          if [ -n "$deployment_id" ]; then
            gh api --method POST \
              "/repos/$GITHUB_REPOSITORY/deployments/${deployment_id}/statuses" \
              -f state=inactive -f description="Reaped by sweep" >/dev/null || true
          fi

          echo "::endgroup::"
        done < orphans.txt
