# Optional: run a daily sweep that tears down any preview environments
# whose PR was closed (or branch deleted) while feature-deploys' webhook
# triggers were unavailable. Drop into .github/workflows/preview-sweep.yml.

name: Preview sweep

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: When `true`, log orphans without actually tearing them down.
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  deployments: write

jobs:
  sweep:
    uses: web-ascender/github-actions-kamal-previews/.github/workflows/sweep.yml@v1
    with:
      base-deploy-file:      config/deploy.staging.yml
      domain-suffix:         preview.example.com
      deploy-host:           staging.example.com
      database-engine:       postgres
      database-template:     myapp_staging
      database-name-pattern: "myapp_{db_slug}"
      dry-run:               ${{ inputs.dry-run && 'true' || 'false' }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PG_HOST:         ${{ secrets.PG_HOST }}
      PG_USER:         ${{ secrets.PG_USER }}
      PG_PASSWORD:     ${{ secrets.PG_PASSWORD }}
      PG_PORT:         ${{ secrets.PG_PORT }}
      PG_SSLMODE:      ${{ secrets.PG_SSLMODE }}
