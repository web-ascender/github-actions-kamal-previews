# Drop this file into your Rails app at .github/workflows/preview.yml.
#
# Composite-action form: a single job, single steps stack. The WireGuard
# tunnel (if your deploy host is private) is a sibling step that runs
# before feature-deploys — they're independent concerns and compose
# naturally.
#
# Repo-level GitHub Actions secrets the workflow expects:
#   DEPLOY_SSH_KEY    — SSH key for the deploy host (Kamal's key).
#   PG_HOST/USER/PASSWORD — DB admin creds (CREATEDB privilege).
#   VPN_PRIVATE_KEY/VPN_PUBLIC_KEY — WireGuard credentials (only if your
#                        deploy host is on a private network).

name: Preview environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  delete:

permissions:
  contents: read
  packages: write          # GHCR push during `kamal deploy`
  pull-requests: write     # rolling status comment
  deployments: write       # GitHub Deployments API
  id-token: write          # OIDC, optional

# Concurrency keyed per-PR so multiple pushes don't deploy in parallel.
# cancel-in-progress: true on deploys (latest push wins).
concurrency:
  group: feature-deploys-${{ github.event.pull_request.number || github.event.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Optional: open a WireGuard tunnel if your deploy host is private.
      # Remove this step if your deploy host is publicly addressable.
      - name: Set up WireGuard VPN
        uses: <your-vpn-action>@v1
        with:
          private-key:    ${{ secrets.VPN_PRIVATE_KEY }}
          public-key:     ${{ secrets.VPN_PUBLIC_KEY }}
          interface-ip:   "10.1.1.100/24"
          endpoint:       "vpn.example.com:51820"
          routes:         '["203.0.113.42"]'

      - name: Deploy / teardown preview
        uses: web-ascender/feature-deploys@v1
        with:
          base-deploy-file:        config/deploy.staging.yml
          base-secrets-file:       .kamal/secrets.staging
          domain-suffix:           preview.example.com
          deploy-host:             staging.example.com
          database-engine:         postgres
          database-template:       myapp_staging
          database-name-pattern:   "myapp_{db_slug}"

          # Optional: tag the per-PR image with the head SHA.
          image-tag: ${{ github.event.pull_request.head.sha }}

          # Optional: cap each preview's resource use.
          memory-limit: "512m"
          cpu-limit:    "0.5"

          # Optional: only deploy previews for branches matching this glob.
          # branch-pattern: "feature/**"

        env:
          # Composite actions can't read `secrets.X` directly — forward the
          # ones we need via `env:`. Keep these tightly scoped to this step.
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PG_HOST:         ${{ secrets.PG_HOST }}
          PG_USER:         ${{ secrets.PG_USER }}
          PG_PASSWORD:     ${{ secrets.PG_PASSWORD }}
          PG_PORT:         ${{ secrets.PG_PORT }}
          PG_SSLMODE:      ${{ secrets.PG_SSLMODE }}
