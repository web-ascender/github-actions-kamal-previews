# Drop this file into your Rails app at .github/workflows/preview.yml.
#
# Composite-action form: a single job, single steps stack. A VPN tunnel
# (if your deploy host is private) is a sibling step that runs before
# kamal-previews — they're independent concerns and compose naturally.
#
# Repo-level GitHub Actions secrets the workflow expects:
#   DEPLOY_SSH_KEY      — SSH key for the deploy host (Kamal's key).
#   STAGING_MASTER_KEY  — Rails master key, only if your secrets file
#                          shells out to `bin/rails credentials:fetch`.
#   DATABASE_ADMIN_URL  — only if your staging app role lacks CREATEDB.
#   VPN credentials     — names depend on the VPN action you choose
#                          (only if your deploy host is on a private
#                          network).

name: Preview environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  delete:

permissions:
  contents: read
  packages: write          # GHCR push during `kamal deploy`
  pull-requests: write     # rolling status comment
  deployments: write       # GitHub Deployments API
  id-token: write          # OIDC, optional

# Cancel a superseded deploy when a new commit lands on the same PR,
# but never cancel a teardown — letting a `closed` event get cancelled
# would leave the preview app + databases orphaned on the host.
concurrency:
  group: kamal-previews-${{ github.event.pull_request.number || github.event.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Optional: open a VPN tunnel if your deploy host is private.
      # Remove this step if your deploy host is publicly addressable.
      # - name: Set up VPN
      #   uses: <your-vpn-action>@v1
      #   with: { ... }

      - name: Deploy / teardown preview
        uses: web-ascender/github-actions-kamal-previews@v1
        with:
          base-deploy-file:    config/deploy.staging.yml
          base-secrets-file:   .kamal/secrets.staging
          domain-suffix:       preview.example.com
          deploy-host:         staging.example.com
          database-engine:     postgres

          # One entry per database. ENV_NAME ending in `_URL` triggers
          # auto-rewriting: kamal-previews reads the URL from your
          # base-secrets-file, swaps the dbname for the per-PR target,
          # and injects via env.secret — no database.yml or secrets file
          # changes required. For Rails 8 multi-DB apps, list each Solid
          # database:
          databases: |
            DATABASE_URL=myapp_staging:myapp_{db_slug}
            # QUEUE_DATABASE_URL=myapp_staging_queue:myapp_queue_{db_slug}
            # CACHE_DATABASE_URL=myapp_staging_cache:myapp_cache_{db_slug}

          # Optional: tag the per-PR image with the head SHA.
          image-tag: ${{ github.event.pull_request.head.sha }}

          # Optional: cap each preview's resource use.
          memory-limit: "512m"
          cpu-limit:    "0.5"

          # Optional: only deploy previews for branches matching this glob.
          # branch-pattern: "feature/**"

        env:
          # Composite actions can't read `secrets.X` directly — forward the
          # ones we need via `env:`. Keep these tightly scoped to this step.
          SSH_PRIVATE_KEY:  ${{ secrets.DEPLOY_SSH_KEY }}

          # Required if .kamal/secrets.staging shells out to
          # `bin/rails credentials:fetch` to populate DATABASE_URL.
          RAILS_MASTER_KEY: ${{ secrets.STAGING_MASTER_KEY }}

          # Optional override: provide an admin URL with CREATEDB if the
          # URL exposed by your secrets file connects as a least-privilege
          # role. Format: postgres://admin:secret@host:5432/postgres?sslmode=verify-full
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
