name: Preview environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  delete:

permissions:
  contents: read
  packages: write
  pull-requests: write
  deployments: write
  id-token: write

concurrency:
  group: kamal-previews-${{ github.event.pull_request.number || github.event.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Optional: WireGuard tunnel if your deploy host is private.
      # - uses: <your-vpn-action>@v1
      #   with: { private-key: ..., public-key: ..., endpoint: ..., interface-ip: ..., routes: ... }

      - uses: web-ascender/github-actions-kamal-previews@v1
        with:
          base-deploy-file:        config/deploy.staging.yml
          base-secrets-file:       .kamal/secrets.staging
          domain-suffix:           preview.example.com
          deploy-host:             staging.example.com
          database-engine:         mysql
          database-template:       myapp_staging
          database-name-pattern:   "myapp_{db_slug}"
          image-tag: ${{ github.event.pull_request.head.sha }}
          memory-limit: "512m"
          cpu-limit:    "0.5"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          MYSQL_HOST:      ${{ secrets.MYSQL_HOST }}
          MYSQL_USER:      ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD:  ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_PORT:      ${{ secrets.MYSQL_PORT }}
          MYSQL_SSL_MODE:  ${{ secrets.MYSQL_SSL_MODE }}
