name: kamal-previews
description: |
  Preview environments for Kamal-deployed Rails apps. Open a pull request,
  get a per-PR Kamal app at a unique URL with a freshly cloned staging
  database. Close the PR, everything tears down.

  Single-step entry point — drop one step into a single-job workflow:

      jobs:
        preview:
          runs-on: ubuntu-latest
          permissions:
            contents: read
            packages: write
            pull-requests: write
            deployments: write
          steps:
            - uses: actions/checkout@v4

            # Optional: open a WireGuard tunnel before this action runs,
            # so SSH to a private deploy host works.
            - uses: <your-vpn-action>@v1
              with: { private-key: ..., public-key: ..., endpoint: ..., interface-ip: ..., routes: ... }

            - uses: web-ascender/github-actions-kamal-previews@v1
              with:
                base-deploy-file:    config/deploy.staging.yml
                base-secrets-file:   .kamal/secrets.staging
                domain-suffix:       preview.example.com
                deploy-host:         staging.example.com
                database-engine:     postgres
                databases: |
                  DATABASE_URL=myapp_staging:myapp_{db_slug}
              env:
                # Forwarded from `secrets.*` in the calling workflow:
                SSH_PRIVATE_KEY:  <your DEPLOY_SSH_KEY secret>
                # Required only if the secrets file shells out to
                # `bin/rails credentials:fetch` to populate DATABASE_URL:
                RAILS_MASTER_KEY: <your STAGING_MASTER_KEY secret>

  Internally dispatches based on the triggering event:
    - pull_request opened/synchronize/reopened   → deploy
    - pull_request closed                        → teardown
    - delete (branch)                            → teardown
    - anything else                              → skip (with notice)

  WireGuard / VPN setup is intentionally NOT in this action — pair it with
  any VPN action you already trust (e.g. `<your-vpn-action>`)
  as a sibling step. Tunnels established in earlier steps remain active for
  the subsequent `kamal-previews` step in the same job.

  Two consumption forms; pick whichever fits:

  - **This composite action** — single-step, sibling-friendly. Use when
    your job needs a sibling VPN tunnel, custom credential-fetch step,
    or any other pre/post step around kamal-previews itself.
  - **Reusable workflow** at
    `web-ascender/github-actions-kamal-previews/.github/workflows/preview.yml@v1` —
    multi-job, with deploy and teardown as separate jobs. Use when you
    don't need sibling steps and want stricter concurrency control.

  Both forms support `branch-pattern` and `max-active-previews`. Neither
  ships with VPN inputs; add the VPN as a sibling step (composite) or a
  pre-step in your wrapping workflow (reusable).

inputs:
  base-deploy-file:           { required: true }
  domain-suffix:              { required: true }
  deploy-host:                { required: true }

  database-engine:            { required: false, default: none }
  databases:
    description: |
      Multi-line list of databases to clone (postgres/mysql only). One entry
      per line, format `ENV_NAME=source_db:target_pattern`. Tokens in the
      pattern: `{slug}`, `{db_slug}`, `{base_database}` (= source).

      Behavior depends on the env-name suffix:

      - `*_URL` (e.g. `DATABASE_URL`, `QUEUE_DATABASE_URL`): the action
        clones the DB, sources `base-secrets-file` to read the original
        URL, swaps the dbname path segment for the per-PR target, and
        injects the rewritten URL into the deployed app via env.secret.
        Your database.yml, Rails credentials, and existing secrets file
        stay untouched. Recommended for most Rails apps.

      - any other suffix (e.g. `*_NAME`): the resolved DB name is written
        to env.clear and exported to $GITHUB_ENV. Use when your app reads
        the name directly or you want to handle URL building yourself.

      Example (Rails 8 multi-DB):
        DATABASE_URL=myapp_staging:myapp_{db_slug}
        QUEUE_DATABASE_URL=myapp_staging_queue:myapp_queue_{db_slug}
        CACHE_DATABASE_URL=myapp_staging_cache:myapp_cache_{db_slug}
    required: false
    default: ""
  database-admin-url-var:
    description: |
      Name of the variable in `base-secrets-file` to source as the admin
      connection URL for cloning. Default: `DATABASE_URL`. Ignored when the
      runner env already has `DATABASE_ADMIN_URL` set, or when no base
      secrets file is configured. The fallback chain is:
        1. `DATABASE_ADMIN_URL` env var (explicit override).
        2. The `<database-admin-url-var>` variable read from
           `base-secrets-file` (e.g. `bin/rails credentials:fetch ...`).
        3. Individual `PG_*` / `MYSQL_*` env vars (last-resort fallback).
    required: false
    default: "DATABASE_URL"

  sqlite-source-path:         { required: false, default: "" }
  sqlite-target-path-pattern: { required: false, default: "" }
  sqlite-also-clone:          { required: false, default: "" }

  base-secrets-file:          { required: false, default: "" }
  domain-label-pattern:       { required: false, default: "{slug}" }
  service-pattern:            { required: false, default: "{base_service}-{slug}" }
  destination-pattern:        { required: false, default: "{slug}" }
  env-label:                  { required: false, default: preview }
  env-overrides:              { required: false, default: "" }
  env-secret-overrides:       { required: false, default: "" }
  deploy-timeout:             { required: false, default: "" }
  builder-context:            { required: false, default: "" }
  prefix-strip:               { required: false, default: "feature/,feat/,fix/,bug/,bugfix/,chore/,hotfix/,release/" }
  image-tag:                  { required: false, default: "" }
  memory-limit:               { required: false, default: "" }
  cpu-limit:                  { required: false, default: "" }
  branch-pattern:
    description: Bash-glob pattern; only branches matching it get previews. Empty = every PR. Teardowns ignore the pattern (they always run).
    required: false
    default: ""
  max-active-previews:
    description: |
      Hard cap on concurrent active previews. The deploy step refuses to
      start a NEW preview when this many are already active (an existing
      preview being re-deployed doesn't count against the cap). 0 (default)
      = unlimited. Counts environments named `preview-*` whose latest
      deployment status isn't `inactive`/`removed`/`failure`/`error`.
    required: false
    default: "0"

  ruby-version:               { required: false, default: "3.3" }
  kamal-version:              { required: false, default: "" }
  bundler-cache:
    description: Runs `bundle install` (with caching) during setup. Default `true` because the dominant Rails-secrets pattern (`bin/rails credentials:fetch`) needs it. Set to `false` only if you have no Gemfile.lock or your secrets pipeline is bundle-free.
    required: false
    default: "true"
  ssh-user:                   { required: false, default: deploy }
  ssh-port:                   { required: false, default: "22" }

outputs:
  slug:
    value: ${{ steps.config.outputs.slug }}
  db_slug:
    value: ${{ steps.config.outputs.db_slug }}
  destination:
    value: ${{ steps.config.outputs.destination }}
  proxy_host:
    value: ${{ steps.config.outputs.proxy_host }}
  url:
    value: ${{ steps.config.outputs.url }}
  database_name:
    value: ${{ steps.config.outputs.database_name }}
  mode:
    value: ${{ steps.dispatch.outputs.mode }}

runs:
  using: composite
  steps:
    # ── Decide mode (deploy / teardown / skip) ────────────────────────────
    - id: dispatch
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        EVENT_REF_TYPE: ${{ github.event.ref_type }}
      run: |
        set -euo pipefail
        if [ "$EVENT_NAME" = "pull_request" ] && [ "$EVENT_ACTION" != "closed" ]; then
          mode=deploy
        elif [ "$EVENT_NAME" = "pull_request" ] && [ "$EVENT_ACTION" = "closed" ]; then
          mode=teardown
        elif [ "$EVENT_NAME" = "delete" ] && [ "$EVENT_REF_TYPE" = "branch" ]; then
          mode=teardown
        else
          echo "::warning::kamal-previews can't infer a mode from event=$EVENT_NAME action=${EVENT_ACTION:-} ref_type=${EVENT_REF_TYPE:-}; skipping."
          mode=skip
        fi
        echo "mode=$mode" >> "$GITHUB_OUTPUT"

    # ── Branch-name resolution + pattern filter (deploys only) ────────────
    - id: branch
      if: steps.dispatch.outputs.mode != 'skip'
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        DELETED_REF: ${{ github.event.ref }}
        PATTERN: ${{ inputs.branch-pattern }}
        MODE: ${{ steps.dispatch.outputs.mode }}
      run: |
        set -euo pipefail
        if [ "$EVENT_NAME" = "delete" ]; then
          name="$DELETED_REF"
        else
          name="$PR_HEAD_REF"
        fi
        if [ -z "$name" ]; then
          echo "::error::Could not resolve branch name from event payload."; exit 1
        fi
        echo "name=$name" >> "$GITHUB_OUTPUT"

        # Branch-pattern filter only applies to deploys; teardowns must
        # always proceed regardless (otherwise enabling a pattern later
        # would orphan previously-deployed previews).
        if [ "$MODE" = "deploy" ] && [ -n "$PATTERN" ]; then
          shopt -s extglob
          # shellcheck disable=SC2053
          if [[ "$name" == $PATTERN ]]; then
            echo "::notice::Branch '$name' matches preview pattern '$PATTERN'."
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Branch '$name' does not match preview pattern '$PATTERN' — skipping."
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "match=true" >> "$GITHUB_OUTPUT"
        fi

    # ── Self-checkout for sub-actions + scripts ───────────────────────────
    - id: kp_meta
      if: steps.dispatch.outputs.mode != 'skip' && steps.branch.outputs.match == 'true'
      shell: bash
      env:
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        # When the action is run locally (e.g. by `act` or in CI on this
        # very repo), action_repository is empty — fall back to a sane
        # default so the self-checkout step still works.
        repo="${ACTION_REPO:-web-ascender/github-actions-kamal-previews}"
        ref="${ACTION_REF:-main}"
        echo "repo=$repo" >> "$GITHUB_OUTPUT"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        echo "kamal-previews: repo=$repo ref=$ref"

    - if: steps.dispatch.outputs.mode != 'skip' && steps.branch.outputs.match == 'true'
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.kp_meta.outputs.repo }}
        ref: ${{ steps.kp_meta.outputs.ref }}
        path: .kamal-previews

    # ── Setup ─────────────────────────────────────────────────────────────
    - if: steps.dispatch.outputs.mode != 'skip' && steps.branch.outputs.match == 'true'
      uses: ./.kamal-previews/.github/actions/setup
      with:
        ruby-version: ${{ inputs.ruby-version }}
        kamal-version: ${{ inputs.kamal-version }}
        bundler-cache: ${{ inputs.bundler-cache }}
        ssh-private-key: ${{ env.SSH_PRIVATE_KEY }}
        setup-buildx: ${{ steps.dispatch.outputs.mode == 'deploy' && 'true' || 'false' }}
        setup-gha-cache: ${{ steps.dispatch.outputs.mode == 'deploy' && 'true' || 'false' }}
        registry-username: ${{ env.KAMAL_REGISTRY_USERNAME }}
        registry-password: ${{ env.KAMAL_REGISTRY_PASSWORD }}

    # ── Generate per-PR Kamal config ──────────────────────────────────────
    - id: config
      if: steps.dispatch.outputs.mode != 'skip' && steps.branch.outputs.match == 'true'
      uses: ./.kamal-previews/.github/actions/generate-config
      with:
        branch-name: ${{ steps.branch.outputs.name }}
        base-deploy-file: ${{ inputs.base-deploy-file }}
        base-secrets-file: ${{ inputs.base-secrets-file }}
        domain-suffix: ${{ inputs.domain-suffix }}
        domain-label-pattern: ${{ inputs.domain-label-pattern }}
        service-pattern: ${{ inputs.service-pattern }}
        destination-pattern: ${{ inputs.destination-pattern }}
        databases: ${{ inputs.databases }}
        image-tag: ${{ inputs.image-tag }}
        env-label: ${{ inputs.env-label }}
        env-overrides: ${{ inputs.env-overrides }}
        env-secret-overrides: ${{ inputs.env-secret-overrides }}
        deploy-timeout: ${{ inputs.deploy-timeout }}
        builder-context: ${{ inputs.builder-context }}
        memory-limit: ${{ inputs.memory-limit }}
        cpu-limit: ${{ inputs.cpu-limit }}
        prefix-strip: ${{ inputs.prefix-strip }}

    # ── Resolve admin URL + per-PR app URLs (postgres/mysql only) ───────
    # Two jobs in one step:
    #   1. Pick an admin URL for cloning (DATABASE_ADMIN_URL > sourced
    #      DATABASE_URL > individual PG_/MYSQL_ fields).
    #   2. For every `*_URL` entry in `databases:`, source the consumer's
    #      base-secrets-file to get the original URL, swap the dbname
    #      path segment for the per-PR target, and inject the rewritten
    #      URL via $GITHUB_ENV + an appended override line in the
    #      generated `.kamal/secrets.<dest>`. The user's database.yml,
    #      Rails credentials, and existing secrets file stay untouched.
    - id: db_admin_url
      if: steps.dispatch.outputs.mode != 'skip' && steps.branch.outputs.match == 'true' && (inputs.database-engine == 'postgres' || inputs.database-engine == 'mysql')
      shell: bash
      env:
        EXPLICIT_URL:      ${{ env.DATABASE_ADMIN_URL }}
        BASE_SECRETS_FILE: ${{ inputs.base-secrets-file }}
        VAR_NAME:          ${{ inputs.database-admin-url-var }}
        DATABASES_FULL:    ${{ steps.config.outputs.databases_resolved }}
        SECRETS_FILE_OUT:  ${{ steps.config.outputs.secrets_file }}
        ENGINE:            ${{ inputs.database-engine }}
        FB_PG_HOST:        ${{ env.PG_HOST }}
        FB_PG_PORT:        ${{ env.PG_PORT }}
        FB_PG_USER:        ${{ env.PG_USER }}
        FB_PG_PASSWORD:    ${{ env.PG_PASSWORD }}
        FB_PG_SSLMODE:     ${{ env.PG_SSLMODE }}
        FB_MYSQL_HOST:     ${{ env.MYSQL_HOST }}
        FB_MYSQL_PORT:     ${{ env.MYSQL_PORT }}
        FB_MYSQL_USER:     ${{ env.MYSQL_USER }}
        FB_MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
        FB_MYSQL_SSL_MODE: ${{ env.MYSQL_SSL_MODE }}
      run: |
        set -euo pipefail

        # Helper: list all *_URL env names declared in `databases:` input.
        url_env_names() {
          if [ -z "${DATABASES_FULL:-}" ]; then return; fi
          while IFS= read -r entry; do
            stripped="${entry#"${entry%%[![:space:]]*}"}"
            stripped="${stripped%"${stripped##*[![:space:]]}"}"
            [ -z "$stripped" ] && continue
            case "$stripped" in \#*) continue ;; esac
            name="${stripped%%=*}"
            case "$name" in *_URL|*_url) printf '%s\n' "$name" ;; esac
          done <<< "$DATABASES_FULL"
        }

        # Helper: target name for a given ENV_NAME (parsed from databases input).
        target_for() {
          local needle="$1"
          while IFS= read -r entry; do
            stripped="${entry#"${entry%%[![:space:]]*}"}"
            stripped="${stripped%"${stripped##*[![:space:]]}"}"
            [ -z "$stripped" ] && continue
            case "$stripped" in \#*) continue ;; esac
            if [ "${stripped%%=*}" = "$needle" ]; then
              local rest="${stripped#*=}"
              printf '%s' "${rest#*:}"
              return
            fi
          done <<< "$DATABASES_FULL"
        }

        # ── Step 1: determine admin URL ───────────────────────────────
        admin_url=""
        if [ -n "${EXPLICIT_URL:-}" ]; then
          admin_url="$EXPLICIT_URL"
        elif [ -n "$BASE_SECRETS_FILE" ] && [ -f "$BASE_SECRETS_FILE" ]; then
          admin_url="$(set -a; . "$BASE_SECRETS_FILE"; set +a; printf '%s' "${!VAR_NAME-}")"
        fi
        if [ -z "$admin_url" ]; then
          case "$ENGINE" in
            postgres)
              if [ -n "${FB_PG_HOST:-}" ] && [ -n "${FB_PG_USER:-}" ]; then
                pp=""; [ -n "${FB_PG_PASSWORD:-}" ] && pp=":$FB_PG_PASSWORD"
                port="${FB_PG_PORT:-5432}"
                qs=""; [ -n "${FB_PG_SSLMODE:-}" ] && qs="?sslmode=$FB_PG_SSLMODE"
                admin_url="postgres://${FB_PG_USER}${pp}@${FB_PG_HOST}:${port}/postgres${qs}"
              fi
              ;;
            mysql)
              if [ -n "${FB_MYSQL_HOST:-}" ] && [ -n "${FB_MYSQL_USER:-}" ]; then
                pp=""; [ -n "${FB_MYSQL_PASSWORD:-}" ] && pp=":$FB_MYSQL_PASSWORD"
                port="${FB_MYSQL_PORT:-3306}"
                qs=""; [ -n "${FB_MYSQL_SSL_MODE:-}" ] && qs="?ssl-mode=$FB_MYSQL_SSL_MODE"
                admin_url="mysql://${FB_MYSQL_USER}${pp}@${FB_MYSQL_HOST}:${port}/mysql${qs}"
              fi
              ;;
          esac
        fi
        if [ -z "$admin_url" ]; then
          echo "::error::Could not resolve a database admin URL. Set DATABASE_ADMIN_URL in env, point base-secrets-file at a file that exposes \$${VAR_NAME}, or provide PG_/MYSQL_ env vars."; exit 1
        fi
        echo "::add-mask::$admin_url"
        echo "KAMAL_PREVIEWS_DB_ADMIN_URL=$admin_url" >> "$GITHUB_ENV"

        # ── Step 2: rewrite per-PR URLs for *_URL entries ────────────
        url_envs="$(url_env_names || true)"
        if [ -z "$url_envs" ]; then
          # No URL-mode entries — nothing more to do.
          exit 0
        fi
        if [ -z "${BASE_SECRETS_FILE:-}" ] || [ ! -f "$BASE_SECRETS_FILE" ]; then
          echo "::error::URL-mode databases entries require a base-secrets-file that exposes the original URL for each entry."; exit 1
        fi

        # Source base-secrets-file once and capture every URL-mode source
        # URL into a captured TSV (env_name<TAB>url, one per line).
        captured="$(
          set -a
          . "$BASE_SECRETS_FILE"
          set +a
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            printf '%s\t%s\n' "$name" "${!name-}"
          done <<< "$url_envs"
        )"

        while IFS=$'\t' read -r env_name source_url; do
          [ -z "$env_name" ] && continue
          if [ -z "$source_url" ]; then
            echo "::error::Could not read \$${env_name} from $BASE_SECRETS_FILE — make sure your secrets file populates it."; exit 1
          fi
          target="$(target_for "$env_name")"
          if [ -z "$target" ]; then
            echo "::error::Internal: could not find target name for $env_name."; exit 1
          fi

          # Swap the dbname path segment. Path is between the authority
          # (scheme://host[:port]) and the next `?`/`#`/end. Userinfo,
          # query, and fragment are preserved byte-for-byte — we never
          # parse them, so password URL-encoding is safe.
          rewritten="$(printf '%s' "$source_url" | sed -E "s|^([a-zA-Z+]+://[^/]+)/[^?#]*|\1/${target}|")"
          if [ "$rewritten" = "$source_url" ] && [ -n "$source_url" ]; then
            echo "::warning::Could not rewrite \$${env_name} (no path segment found in URL?). Using source URL unchanged."
          fi

          echo "::add-mask::$rewritten"
          kp_var="KAMAL_PREVIEWS_${env_name}"
          echo "${kp_var}=${rewritten}" >> "$GITHUB_ENV"

          # Append an override line to the per-PR secrets file. Kamal
          # evaluates that file in a subshell at deploy time; the user's
          # original `bin/rails credentials:fetch` runs first, then our
          # appended line wins because bash assignment-order means the
          # last assignment to a variable in the same shell wins.
          if [ -n "${SECRETS_FILE_OUT:-}" ] && [ -f "$SECRETS_FILE_OUT" ]; then
            printf '\n# kamal-previews: per-PR override of %s\n%s=$%s\n' "$env_name" "$env_name" "$kp_var" >> "$SECRETS_FILE_OUT"
          else
            echo "::error::Cannot append URL override — no per-PR secrets file was generated. Did you set base-secrets-file?"; exit 1
          fi
        done <<< "$captured"

    - id: sqlite_path
      if: steps.dispatch.outputs.mode != 'skip' && steps.branch.outputs.match == 'true' && inputs.database-engine == 'sqlite'
      shell: bash
      env:
        PATTERN: ${{ inputs.sqlite-target-path-pattern }}
        SLUG: ${{ steps.config.outputs.slug }}
        DB_SLUG: ${{ steps.config.outputs.db_slug }}
      run: |
        set -euo pipefail
        if [ -z "$PATTERN" ]; then
          echo "::error::sqlite-target-path-pattern is required when database-engine=sqlite"; exit 1
        fi
        resolved="${PATTERN//\{slug\}/$SLUG}"
        resolved="${resolved//\{db_slug\}/$DB_SLUG}"
        echo "path=$resolved" >> "$GITHUB_OUTPUT"

    # ── DEPLOY PATH ──────────────────────────────────────────────────────
    - name: Enforce max-active-previews cap
      if: steps.dispatch.outputs.mode == 'deploy' && steps.branch.outputs.match == 'true' && inputs.max-active-previews != '0'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        MAX_ACTIVE: ${{ inputs.max-active-previews }}
        MY_ENV: preview-${{ steps.config.outputs.slug }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        # List every deployment whose latest status is "active" for envs
        # named `preview-*`. Exclude our OWN env so a re-deploy never gets
        # blocked by the cap.
        mapfile -t active_envs < <(
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GH_REPO/environments" --paginate \
            --jq '.environments[]?.name // .[]?.name' \
            | grep -E '^preview-' || true
        )
        active_count=0
        for env in "${active_envs[@]}"; do
          [ "$env" = "$MY_ENV" ] && continue
          deployment_id="$(gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GH_REPO/deployments?environment=${env}&per_page=1" \
            --jq '.[0].id // empty' || true)"
          [ -z "$deployment_id" ] && continue
          latest_state="$(gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GH_REPO/deployments/${deployment_id}/statuses?per_page=1" \
            --jq '.[0].state // empty' || true)"
          case "$latest_state" in
            ""|inactive|removed|failure|error) ;;
            *) active_count=$((active_count + 1)) ;;
          esac
        done

        echo "Active preview environments (excluding this one): $active_count / $MAX_ACTIVE cap"
        if [ "$active_count" -ge "$MAX_ACTIVE" ]; then
          msg="🚦 **Preview cap reached.** ${active_count} active preview environments are already running, which meets the cap of \`max-active-previews=${MAX_ACTIVE}\`. Close another preview PR (or wait for it to be torn down) and re-run this workflow."
          if [ -n "${PR_NUMBER:-}" ]; then
            body="$(printf '<!-- kamal-previews:status -->\n%s' "$msg")"
            gh api --method POST "/repos/$GH_REPO/issues/${PR_NUMBER}/comments" \
              -f body="$body" >/dev/null || true
          fi
          echo "::error::$msg"
          exit 1
        fi

    - if: steps.dispatch.outputs.mode == 'deploy' && steps.branch.outputs.match == 'true'
      uses: ./.kamal-previews/.github/actions/deployment-status
      with:
        state: created
        environment-name: preview-${{ steps.config.outputs.slug }}

    - if: steps.dispatch.outputs.mode == 'deploy' && steps.branch.outputs.match == 'true'
      uses: ./.kamal-previews/.github/actions/pr-comment
      with:
        state: building
        url: ${{ steps.config.outputs.url }}
        destination: ${{ steps.config.outputs.destination }}
        database-name: ${{ steps.config.outputs.database_name }}

    - if: steps.dispatch.outputs.mode == 'deploy' && steps.branch.outputs.match == 'true' && inputs.database-engine != 'none'
      uses: ./.kamal-previews/.github/actions/clone-database
      with:
        engine: ${{ inputs.database-engine }}
        host: ${{ inputs.deploy-host }}
        ssh-user: ${{ inputs.ssh-user }}
        ssh-port: ${{ inputs.ssh-port }}
        admin-url: ${{ env.KAMAL_PREVIEWS_DB_ADMIN_URL }}
        databases: ${{ steps.config.outputs.databases_resolved }}
        sqlite-source-path: ${{ inputs.sqlite-source-path }}
        sqlite-target-path: ${{ steps.sqlite_path.outputs.path }}
        sqlite-also-clone: ${{ inputs.sqlite-also-clone }}

    - if: steps.dispatch.outputs.mode == 'deploy' && steps.branch.outputs.match == 'true'
      uses: ./.kamal-previews/.github/actions/deploy
      with:
        destination: ${{ steps.config.outputs.destination }}

    - if: steps.dispatch.outputs.mode == 'deploy' && steps.branch.outputs.match == 'true' && success()
      uses: ./.kamal-previews/.github/actions/deployment-status
      with:
        state: success
        environment-name: preview-${{ steps.config.outputs.slug }}
        url: ${{ steps.config.outputs.url }}

    - if: steps.dispatch.outputs.mode == 'deploy' && steps.branch.outputs.match == 'true' && success()
      uses: ./.kamal-previews/.github/actions/pr-comment
      with:
        state: ready
        url: ${{ steps.config.outputs.url }}
        destination: ${{ steps.config.outputs.destination }}
        database-name: ${{ steps.config.outputs.database_name }}

    - if: steps.dispatch.outputs.mode == 'deploy' && steps.branch.outputs.match == 'true' && failure()
      uses: ./.kamal-previews/.github/actions/deployment-status
      with:
        state: failure
        environment-name: preview-${{ steps.config.outputs.slug }}

    - if: steps.dispatch.outputs.mode == 'deploy' && steps.branch.outputs.match == 'true' && failure()
      uses: ./.kamal-previews/.github/actions/pr-comment
      with:
        state: failed
        destination: ${{ steps.config.outputs.destination }}
        database-name: ${{ steps.config.outputs.database_name }}

    # ── TEARDOWN PATH ────────────────────────────────────────────────────
    - if: steps.dispatch.outputs.mode == 'teardown'
      uses: ./.kamal-previews/.github/actions/teardown
      with:
        destination: ${{ steps.config.outputs.destination }}

    - if: steps.dispatch.outputs.mode == 'teardown' && inputs.database-engine != 'none'
      uses: ./.kamal-previews/.github/actions/drop-database
      with:
        engine: ${{ inputs.database-engine }}
        host: ${{ inputs.deploy-host }}
        ssh-user: ${{ inputs.ssh-user }}
        ssh-port: ${{ inputs.ssh-port }}
        admin-url: ${{ env.KAMAL_PREVIEWS_DB_ADMIN_URL }}
        databases: ${{ steps.config.outputs.databases_resolved }}
        sqlite-target-path: ${{ steps.sqlite_path.outputs.path }}
        sqlite-also-drop: ${{ inputs.sqlite-also-clone }}

    - if: steps.dispatch.outputs.mode == 'teardown' && always()
      uses: ./.kamal-previews/.github/actions/deployment-status
      with:
        state: removed
        environment-name: preview-${{ steps.config.outputs.slug }}

    - if: steps.dispatch.outputs.mode == 'teardown' && always() && github.event_name == 'pull_request'
      uses: ./.kamal-previews/.github/actions/pr-comment
      with:
        state: removed
        destination: ${{ steps.config.outputs.destination }}
        database-name: ${{ steps.config.outputs.database_name }}
        pr-number: ${{ github.event.pull_request.number }}
