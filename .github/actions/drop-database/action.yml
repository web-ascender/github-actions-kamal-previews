name: kamal-previews / drop-database
description: |
  Drops the per-PR database during teardown. Mirrors the inputs of
  `clone-database`.

inputs:
  engine:
    description: One of `postgres`, `mysql`, `sqlite`.
    required: true
  host:
    description: SSH host (typically the Kamal deploy host).
    required: true
  ssh-user:
    required: false
    default: deploy
  ssh-port:
    required: false
    default: "22"
  docker-image:
    description: Docker image with the right client tools. Defaults to `postgres:16-alpine` (postgres) or `mysql:8.4` (mysql). Ignored for sqlite.
    required: false
    default: ""

  admin-url:
    description: |
      Admin connection URL with privileges to DROP DATABASE on the target
      server. Required for postgres/mysql. See `clone-database` for format.
    required: false
    default: ""

  sqlite-target-path:
    description: Absolute path on the deploy host to the SQLite file to remove.
    required: false
    default: ""
  sqlite-also-drop:
    description: Space-separated suffixes for companion DB files to also drop.
    required: false
    default: ""

  databases:
    description: |
      Multi-line list of databases to drop (postgres/mysql only). Each line:
        ENV_NAME=source_db:target_db
      (Same shape as clone-database for symmetry; only the target portion is
      used here.) Typically passed straight from generate-config's
      `databases_resolved` output.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: validate
      shell: bash
      env:
        INPUT_ENGINE: ${{ inputs.engine }}
        INPUT_HOST: ${{ inputs.host }}
        INPUT_DATABASES: ${{ inputs.databases }}
        INPUT_ADMIN_URL: ${{ inputs.admin-url }}
        INPUT_SQLITE_TARGET_PATH: ${{ inputs.sqlite-target-path }}
      run: |
        set -euo pipefail
        case "$INPUT_ENGINE" in postgres|mysql|sqlite) ;; *) echo "bad engine"; exit 1;; esac
        if [ -z "$INPUT_HOST" ]; then echo "host is required"; exit 1; fi
        # NOTE: use `if … fi` rather than `[ -z … ] && { … }`. The latter as
        # the last statement in a case branch propagates a non-zero exit
        # status when the test is false (because && short-circuits and the
        # compound returns 1), which becomes the script's overall exit code.
        case "$INPUT_ENGINE" in
          postgres|mysql)
            if [ -z "$INPUT_DATABASES" ]; then echo "databases input is required for $INPUT_ENGINE"; exit 1; fi
            if [ -z "$INPUT_ADMIN_URL" ]; then echo "admin-url is required for $INPUT_ENGINE"; exit 1; fi
            ;;
          sqlite)
            if [ -z "$INPUT_SQLITE_TARGET_PATH" ]; then echo "sqlite-target-path is required"; exit 1; fi
            ;;
        esac

    - id: drop
      shell: bash
      env:
        INPUT_ENGINE: ${{ inputs.engine }}
        INPUT_HOST: ${{ inputs.host }}
        INPUT_SSH_USER: ${{ inputs.ssh-user }}
        INPUT_SSH_PORT: ${{ inputs.ssh-port }}
        INPUT_DOCKER_IMAGE: ${{ inputs.docker-image }}
        INPUT_ADMIN_URL: ${{ inputs.admin-url }}
        INPUT_DATABASES: ${{ inputs.databases }}
        INPUT_SQLITE_TARGET_PATH: ${{ inputs.sqlite-target-path }}
        INPUT_SQLITE_ALSO_DROP: ${{ inputs.sqlite-also-drop }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        scripts_dir="$(cd "$ACTION_PATH/../../../scripts" && pwd)"

        ssh_target="${INPUT_SSH_USER}@${INPUT_HOST}"
        ssh_opts=(-o StrictHostKeyChecking=accept-new -p "${INPUT_SSH_PORT}")
        scp_opts=(-o StrictHostKeyChecking=accept-new -P "${INPUT_SSH_PORT}")

        docker_image="$INPUT_DOCKER_IMAGE"
        if [ -z "$docker_image" ]; then
          case "$INPUT_ENGINE" in
            postgres) docker_image="postgres:16-alpine" ;;
            mysql) docker_image="mysql:8.4" ;;
          esac
        fi

        remote_dir="$(ssh "${ssh_opts[@]}" "$ssh_target" 'mktemp -d')"
        cleanup() { ssh "${ssh_opts[@]}" "$ssh_target" "rm -rf '$remote_dir'" || true; }
        trap cleanup EXIT

        scp "${scp_opts[@]}" -r "$scripts_dir/lib" "$ssh_target:$remote_dir/"
        scp "${scp_opts[@]}" -r "$scripts_dir/$INPUT_ENGINE" "$ssh_target:$remote_dir/"

        # Parse the target list from databases:. We only use the target
        # portion of each ENV_NAME=source:target entry.
        targets=()
        if [ "$INPUT_ENGINE" != "sqlite" ]; then
          while IFS= read -r line; do
            stripped="${line#"${line%%[![:space:]]*}"}"
            stripped="${stripped%"${stripped##*[![:space:]]}"}"
            [ -z "$stripped" ] && continue
            case "$stripped" in \#*) continue ;; esac
            case "$stripped" in
              *=*:*) ;;
              *) echo "::error::malformed databases entry (expected ENV_NAME=source:target): $stripped"; exit 1 ;;
            esac
            rest="${stripped#*=}"
            tgt="${rest#*:}"
            [ -z "$tgt" ] && { echo "::error::databases entry has empty target: $stripped"; exit 1; }
            targets+=("$tgt")
          done <<< "$INPUT_DATABASES"
        fi

        # shellcheck source=../lib/parse-db-url.sh
        source "$ACTION_PATH/../lib/parse-db-url.sh"
        kp_parse_db_url "$INPUT_ADMIN_URL"

        run_pg_or_mysql_drop() {
          local tgt="$1"
          local local_env
          local_env="$(mktemp)"
          case "$INPUT_ENGINE" in
            postgres)
              {
                printf 'PGHOST=%s\n' "$KP_DB_HOST"
                printf 'PGPORT=%s\n' "${KP_DB_PORT:-5432}"
                printf 'PGUSER=%s\n' "$KP_DB_USER"
                printf 'PGPASSWORD=%s\n' "$KP_DB_PASSWORD"
                [ -n "${KP_DB_SSLMODE:-}" ] && printf 'PGSSLMODE=%s\n' "$KP_DB_SSLMODE"
                # See clone action for why we forward the admin URL's dbname.
                [ -n "${KP_DB_DBNAME:-}" ] && printf 'MAINTENANCE_DATABASE=%s\n' "$KP_DB_DBNAME"
                printf 'TARGET_DATABASE=%s\n' "$tgt"
              } > "$local_env"
              ;;
            mysql)
              {
                printf 'MYSQL_HOST=%s\n' "$KP_DB_HOST"
                printf 'MYSQL_PORT=%s\n' "${KP_DB_PORT:-3306}"
                printf 'MYSQL_USER=%s\n' "$KP_DB_USER"
                printf 'MYSQL_PASSWORD=%s\n' "$KP_DB_PASSWORD"
                [ -n "${KP_DB_SSL_MODE:-}" ] && printf 'MYSQL_SSL_MODE=%s\n' "$KP_DB_SSL_MODE"
                printf 'TARGET_DATABASE=%s\n' "$tgt"
              } > "$local_env"
              ;;
          esac
          scp "${scp_opts[@]}" "$local_env" "$ssh_target:$remote_dir/.env"
          rm -f "$local_env"
          ssh "${ssh_opts[@]}" "$ssh_target" \
            "docker run --rm \
               --env-file '$remote_dir/.env' \
               --network host \
               -v '$remote_dir:/work:ro' \
               '$docker_image' \
               bash /work/$INPUT_ENGINE/drop.sh"
        }

        case "$INPUT_ENGINE" in
          postgres|mysql)
            for tgt in "${targets[@]}"; do
              echo "::group::drop $INPUT_ENGINE $tgt"
              run_pg_or_mysql_drop "$tgt"
              echo "::endgroup::"
            done
            ;;
          sqlite)
            local_env="$(mktemp)"
            {
              printf 'TARGET_PATH=%s\n' "$INPUT_SQLITE_TARGET_PATH"
              [ -n "$INPUT_SQLITE_ALSO_DROP" ] && printf 'ALSO_DROP=%s\n' "$INPUT_SQLITE_ALSO_DROP"
            } > "$local_env"
            scp "${scp_opts[@]}" "$local_env" "$ssh_target:$remote_dir/.env"
            rm -f "$local_env"
            ssh "${ssh_opts[@]}" "$ssh_target" \
              "set -a && . '$remote_dir/.env' && set +a && bash '$remote_dir/sqlite/drop.sh'"
            ;;
        esac
