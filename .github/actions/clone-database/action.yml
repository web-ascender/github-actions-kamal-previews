name: kamal-previews / clone-database
description: |
  Clones the configured staging database into a per-PR target. Runs over SSH
  on the deploy host (so neither the GitHub runner nor any other machine
  needs network access to the database server).

  For PostgreSQL and MySQL, the action uploads the appropriate script to the
  deploy host and runs it inside a Docker container with the official client
  image — the deploy host itself does not need `psql`, `mysqldump`, etc.
  installed. For SQLite, the action runs the script directly against files on
  the host (the host needs `sqlite3` installed; on Debian/Ubuntu:
  `apt install sqlite3`).

inputs:
  engine:
    description: One of `postgres`, `mysql`, `sqlite`.
    required: true
  host:
    description: SSH host where the script should run (typically your Kamal deploy host).
    required: true
  ssh-user:
    description: SSH user. Default `deploy`.
    required: false
    default: deploy
  ssh-port:
    description: SSH port. Default 22.
    required: false
    default: "22"
  docker-image:
    description: Docker image used to run the postgres/mysql client tools on the host. Defaults to `postgres:16-alpine` for engine=postgres and `mysql:8.4` for engine=mysql. Ignored for sqlite.
    required: false
    default: ""

  admin-url:
    description: |
      Admin connection URL with privileges to CREATE / DROP databases on the
      source server. Required for postgres/mysql; ignored for sqlite. Format:
        postgres://user:password@host:port/dbname[?sslmode=...]
        mysql://user:password@host:port/dbname[?ssl-mode=...]
      The dbname in the URL path is ignored for cloning — we always connect
      to the engine's maintenance DB (`postgres` / `mysql`).
    required: false
    default: ""

  # SQLite
  sqlite-source-path:
    description: Absolute path on the deploy host to the source SQLite file. Required when engine=sqlite.
    required: false
    default: ""
  sqlite-target-path:
    description: Absolute path on the deploy host where the cloned SQLite file should land. Required when engine=sqlite.
    required: false
    default: ""
  sqlite-also-clone:
    description: Space-separated suffixes for companion DB files (e.g. "_queue _cache _cable").
    required: false
    default: ""

  # Common (postgres/mysql)
  databases:
    description: |
      Multi-line list of databases to clone (postgres/mysql only). Each line:
        ENV_NAME=source_db:target_db
      Typically passed straight from generate-config's `databases_resolved`
      output. The `ENV_NAME` is ignored by clone-database (it's there for
      env.clear injection in the per-PR deploy.yml); only `source:target`
      are used here.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: validate
      shell: bash
      env:
        INPUT_ENGINE: ${{ inputs.engine }}
        INPUT_HOST: ${{ inputs.host }}
        INPUT_DATABASES: ${{ inputs.databases }}
        INPUT_ADMIN_URL: ${{ inputs.admin-url }}
        INPUT_SQLITE_SOURCE_PATH: ${{ inputs.sqlite-source-path }}
        INPUT_SQLITE_TARGET_PATH: ${{ inputs.sqlite-target-path }}
      run: |
        set -euo pipefail
        case "$INPUT_ENGINE" in
          postgres|mysql|sqlite) ;;
          *) echo "engine must be one of postgres, mysql, sqlite (got: $INPUT_ENGINE)"; exit 1 ;;
        esac
        if [ -z "$INPUT_HOST" ]; then echo "host is required"; exit 1; fi
        # NOTE: use `if … fi` rather than `[ -z … ] && { … }`. The latter as
        # the last statement in a case branch propagates a non-zero exit
        # status when the test is false (because && short-circuits and the
        # compound returns 1), which becomes the script's overall exit code.
        case "$INPUT_ENGINE" in
          postgres|mysql)
            if [ -z "$INPUT_DATABASES" ]; then echo "databases input is required for $INPUT_ENGINE"; exit 1; fi
            if [ -z "$INPUT_ADMIN_URL" ]; then echo "admin-url is required for $INPUT_ENGINE"; exit 1; fi
            ;;
          sqlite)
            if [ -z "$INPUT_SQLITE_SOURCE_PATH" ]; then echo "sqlite-source-path is required for sqlite"; exit 1; fi
            if [ -z "$INPUT_SQLITE_TARGET_PATH" ]; then echo "sqlite-target-path is required for sqlite"; exit 1; fi
            ;;
        esac

    - id: clone
      shell: bash
      env:
        INPUT_ENGINE: ${{ inputs.engine }}
        INPUT_HOST: ${{ inputs.host }}
        INPUT_SSH_USER: ${{ inputs.ssh-user }}
        INPUT_SSH_PORT: ${{ inputs.ssh-port }}
        INPUT_DOCKER_IMAGE: ${{ inputs.docker-image }}
        INPUT_ADMIN_URL: ${{ inputs.admin-url }}
        INPUT_DATABASES: ${{ inputs.databases }}
        INPUT_SQLITE_SOURCE_PATH: ${{ inputs.sqlite-source-path }}
        INPUT_SQLITE_TARGET_PATH: ${{ inputs.sqlite-target-path }}
        INPUT_SQLITE_ALSO_CLONE: ${{ inputs.sqlite-also-clone }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # Resolve scripts directory relative to this action.
        scripts_dir="$(cd "$ACTION_PATH/../../../scripts" && pwd)"

        ssh_target="${INPUT_SSH_USER}@${INPUT_HOST}"
        ssh_opts=(-o StrictHostKeyChecking=accept-new -p "${INPUT_SSH_PORT}")
        scp_opts=(-o StrictHostKeyChecking=accept-new -P "${INPUT_SSH_PORT}")

        # Default Docker images
        docker_image="$INPUT_DOCKER_IMAGE"
        if [ -z "$docker_image" ]; then
          case "$INPUT_ENGINE" in
            postgres) docker_image="postgres:16-alpine" ;;
            mysql) docker_image="mysql:8.4" ;;
          esac
        fi

        # Make a temp directory on the host (single SCP of scripts; we
        # rewrite the env file per-DB and re-run the clone script in a loop).
        remote_dir="$(ssh "${ssh_opts[@]}" "$ssh_target" 'mktemp -d')"
        cleanup() { ssh "${ssh_opts[@]}" "$ssh_target" "rm -rf '$remote_dir'" || true; }
        trap cleanup EXIT

        # Upload the engine scripts + the shared lib once.
        scp "${scp_opts[@]}" -r "$scripts_dir/lib" "$ssh_target:$remote_dir/"
        scp "${scp_opts[@]}" -r "$scripts_dir/$INPUT_ENGINE" "$ssh_target:$remote_dir/"

        # Parse the source:target list. Format: ENV_NAME=source:target per
        # line — env-name is ignored by clone-database (it's for env.clear
        # injection in the per-PR deploy.yml).
        pairs=()
        if [ "$INPUT_ENGINE" != "sqlite" ]; then
          while IFS= read -r line; do
            stripped="${line#"${line%%[![:space:]]*}"}"
            stripped="${stripped%"${stripped##*[![:space:]]}"}"
            [ -z "$stripped" ] && continue
            case "$stripped" in \#*) continue ;; esac
            case "$stripped" in
              *=*:*) ;;
              *) echo "::error::malformed databases entry (expected ENV_NAME=source:target): $stripped"; exit 1 ;;
            esac
            rest="${stripped#*=}"
            src="${rest%%:*}"
            tgt="${rest#*:}"
            if [ -z "$src" ] || [ -z "$tgt" ]; then
              echo "::error::databases entry has empty source or target: $stripped"; exit 1
            fi
            pairs+=("$src:$tgt")
          done <<< "$INPUT_DATABASES"
        fi

        # Parse the admin URL once; reuse the components for every clone.
        # shellcheck source=../lib/parse-db-url.sh
        source "$ACTION_PATH/../lib/parse-db-url.sh"
        kp_parse_db_url "$INPUT_ADMIN_URL"

        run_pg_or_mysql_clone() {
          local src="$1" tgt="$2"
          local local_env
          local_env="$(mktemp)"
          case "$INPUT_ENGINE" in
            postgres)
              {
                printf 'PGHOST=%s\n' "$KP_DB_HOST"
                printf 'PGPORT=%s\n' "${KP_DB_PORT:-5432}"
                printf 'PGUSER=%s\n' "$KP_DB_USER"
                printf 'PGPASSWORD=%s\n' "$KP_DB_PASSWORD"
                [ -n "${KP_DB_SSLMODE:-}" ] && printf 'PGSSLMODE=%s\n' "$KP_DB_SSLMODE"
                # Use the dbname from the admin URL as the maintenance DB.
                # Managed services (e.g. DigitalOcean = `defaultdb`) often
                # don't expose a `postgres` DB at all, but the admin URL is
                # already proven to connect to *some* working DB.
                [ -n "${KP_DB_DBNAME:-}" ] && printf 'MAINTENANCE_DATABASE=%s\n' "$KP_DB_DBNAME"
                printf 'SOURCE_DATABASE=%s\n' "$src"
                printf 'TARGET_DATABASE=%s\n' "$tgt"
              } > "$local_env"
              ;;
            mysql)
              {
                printf 'MYSQL_HOST=%s\n' "$KP_DB_HOST"
                printf 'MYSQL_PORT=%s\n' "${KP_DB_PORT:-3306}"
                printf 'MYSQL_USER=%s\n' "$KP_DB_USER"
                printf 'MYSQL_PASSWORD=%s\n' "$KP_DB_PASSWORD"
                [ -n "${KP_DB_SSL_MODE:-}" ] && printf 'MYSQL_SSL_MODE=%s\n' "$KP_DB_SSL_MODE"
                printf 'SOURCE_DATABASE=%s\n' "$src"
                printf 'TARGET_DATABASE=%s\n' "$tgt"
              } > "$local_env"
              ;;
          esac
          scp "${scp_opts[@]}" "$local_env" "$ssh_target:$remote_dir/.env"
          rm -f "$local_env"
          ssh "${ssh_opts[@]}" "$ssh_target" \
            "docker run --rm \
               --env-file '$remote_dir/.env' \
               --network host \
               -v '$remote_dir:/work:ro' \
               '$docker_image' \
               bash /work/$INPUT_ENGINE/clone.sh"
        }

        case "$INPUT_ENGINE" in
          postgres|mysql)
            for pair in "${pairs[@]}"; do
              src="${pair%%:*}"
              tgt="${pair#*:}"
              echo "::group::clone $INPUT_ENGINE $src -> $tgt"
              run_pg_or_mysql_clone "$src" "$tgt"
              echo "::endgroup::"
            done
            ;;
          sqlite)
            local_env="$(mktemp)"
            {
              printf 'SOURCE_PATH=%s\n' "$INPUT_SQLITE_SOURCE_PATH"
              printf 'TARGET_PATH=%s\n' "$INPUT_SQLITE_TARGET_PATH"
              [ -n "$INPUT_SQLITE_ALSO_CLONE" ] && printf 'ALSO_CLONE=%s\n' "$INPUT_SQLITE_ALSO_CLONE"
            } > "$local_env"
            scp "${scp_opts[@]}" "$local_env" "$ssh_target:$remote_dir/.env"
            rm -f "$local_env"
            ssh "${ssh_opts[@]}" "$ssh_target" \
              "set -a && . '$remote_dir/.env' && set +a && bash '$remote_dir/sqlite/clone.sh'"
            ;;
        esac
