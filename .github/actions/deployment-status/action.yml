name: kamal-previews / deployment-status
description: |
  Creates or updates a GitHub Deployment so the PR shows the native
  "View deployment" button. On `created`, marks the deployment in_progress,
  then transitions to `success` or `failure`. On `removed`, transitions
  the deployment to `inactive`.

inputs:
  state:
    description: One of `created`, `success`, `failure`, `removed`.
    required: true
  environment-name:
    description: Environment name (must be unique per preview app — typically `preview-<slug>`).
    required: true
  url:
    description: Environment URL (only meaningful when state is `success`).
    required: false
    default: ""
  ref:
    description: Git ref for the deployment. Default = the PR head SHA when available.
    required: false
    default: ""
  github-token:
    required: false
    default: ${{ github.token }}

outputs:
  deployment_id:
    description: ID of the created or located deployment.
    value: ${{ steps.run.outputs.deployment_id }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        STATE: ${{ inputs.state }}
        ENVIRONMENT: ${{ inputs.environment-name }}
        URL: ${{ inputs.url }}
        REF_INPUT: ${{ inputs.ref }}
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail

        ref="${REF_INPUT:-${EVENT_HEAD_SHA:-$GITHUB_SHA}}"

        find_deployment() {
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GH_REPO/deployments?environment=$ENVIRONMENT&per_page=1" \
            --jq '.[0].id // empty'
        }

        # All Deployments API calls are best-effort — registering a
        # GitHub Deployment is a UX nicety (the "View deployment" button
        # on the PR), not load-bearing. If GitHub rejects the request —
        # most commonly because of repository rulesets that enforce
        # status-check requirements regardless of `required_contexts: []`
        # / `auto_merge: false` — we log a clear warning and let the
        # rest of the pipeline (clone, deploy, PR comment) proceed.
        # Hard-failing on this step would let a config quirk block real
        # preview deploys.

        create_deployment() {
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GH_REPO/deployments" \
            -f ref="$ref" \
            -f environment="$ENVIRONMENT" \
            -F transient_environment=true \
            -F auto_inactive=true \
            -F auto_merge=false \
            -F required_contexts:='[]' \
            -f description="kamal-previews preview environment" \
            --jq '.id' 2>&1
        }

        warn_api_skip() {
          local out="$1"
          echo "::warning::GitHub Deployments API rejected the request — skipping deployment registration. Preview deploy continues; only the 'View deployment' button on the PR is missing. Most common cause: repository rulesets requiring status checks. API response: $out"
        }

        deployment_id=""
        case "$STATE" in
          created)
            out="$(create_deployment || true)"
            if [[ "$out" =~ ^[0-9]+$ ]]; then
              deployment_id="$out"
              gh api --method POST -H 'Accept: application/vnd.github+json' \
                "/repos/$GH_REPO/deployments/$deployment_id/statuses" \
                -f state=in_progress \
                -f description="Deploying…" >/dev/null 2>&1 || true
            else
              warn_api_skip "$out"
            fi
            ;;
          success|failure)
            deployment_id="$(find_deployment 2>/dev/null || true)"
            if [ -z "$deployment_id" ]; then
              # Creation may have been skipped (fail-soft above) or the
              # deploy fast-failed before we got that far. Try once more.
              out="$(create_deployment || true)"
              if [[ "$out" =~ ^[0-9]+$ ]]; then
                deployment_id="$out"
              else
                warn_api_skip "$out"
              fi
            fi
            if [ -n "$deployment_id" ]; then
              extra=()
              [ -n "$URL" ] && extra+=(-f environment_url="$URL" -f log_url="$URL")
              gh api --method POST -H 'Accept: application/vnd.github+json' \
                "/repos/$GH_REPO/deployments/$deployment_id/statuses" \
                -f state="$STATE" \
                -f description="Deployment $STATE" \
                "${extra[@]}" >/dev/null 2>&1 \
                || echo "::warning::Could not post deployment status — continuing."
            fi
            ;;
          removed)
            deployment_id="$(find_deployment 2>/dev/null || true)"
            if [ -z "$deployment_id" ]; then
              echo "No deployment for environment $ENVIRONMENT — nothing to mark inactive."
              echo "deployment_id=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh api --method POST -H 'Accept: application/vnd.github+json' \
              "/repos/$GH_REPO/deployments/$deployment_id/statuses" \
              -f state=inactive \
              -f description="Deployment torn down" >/dev/null 2>&1 \
              || echo "::warning::Could not mark deployment inactive — continuing."
            ;;
          *)
            echo "Unknown state: $STATE"; exit 1 ;;
        esac

        echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
