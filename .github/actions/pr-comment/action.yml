name: kamal-previews / pr-comment
description: |
  Posts (or updates in place) a single rolling comment on the PR with the
  current preview-environment status. Identifies its own previous comment
  via a hidden HTML marker so we never spam the PR with multiple comments.

inputs:
  state:
    description: One of `building`, `ready`, `failed`, `removed`.
    required: true
  url:
    description: Public URL of the preview app.
    required: false
    default: ""
  destination:
    description: Kamal destination (used in the comment body for context).
    required: false
    default: ""
  database-name:
    description: Resolved database name (used in the comment body).
    required: false
    default: ""
  pr-number:
    description: PR number to comment on. Default = current PR if available.
    required: false
    default: ""
  github-token:
    description: "GitHub token with `pull-requests: write`."
    required: false
    default: ${{ github.token }}
  marker:
    description: Hidden HTML marker used to identify our previous comment.
    required: false
    default: <!-- kamal-previews:status -->

runs:
  using: composite
  steps:
    - shell: bash
      env:
        STATE: ${{ inputs.state }}
        URL: ${{ inputs.url }}
        DEST: ${{ inputs.destination }}
        DB_NAME: ${{ inputs.database-name }}
        PR_NUMBER_INPUT: ${{ inputs.pr-number }}
        MARKER: ${{ inputs.marker }}
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        EVENT_PR: ${{ github.event.pull_request.number }}
        RUN_ID: ${{ github.run_id }}
        SERVER_URL: ${{ github.server_url }}
      run: |
        set -euo pipefail

        pr_number="${PR_NUMBER_INPUT:-$EVENT_PR}"
        if [ -z "$pr_number" ]; then
          echo "::warning::No PR number available — skipping PR comment."
          exit 0
        fi

        # Compose body
        case "$STATE" in
          building) emoji=":hourglass_flowing_sand:" ; status="Building preview environment…" ;;
          ready)    emoji=":white_check_mark:"      ; status="Preview environment is **ready**." ;;
          failed)   emoji=":x:"                     ; status="Preview environment **failed to deploy**." ;;
          removed)  emoji=":wastebasket:"           ; status="Preview environment **removed**." ;;
          *)        emoji=":information_source:"    ; status="Status: \`$STATE\`" ;;
        esac

        # Build the body in a temp file so internal newlines survive. We
        # can't use `body="$(printf …)"` followed by `body+="$(printf …)"`
        # — `$(…)` strips trailing newlines, so each appended chunk would
        # collide with the previous one and the markdown table/list would
        # collapse onto a single line.
        body_file="$(mktemp)"
        {
          printf '%s\n' "$MARKER"
          printf '%s %s\n\n' "$emoji" "$status"
          [ -n "$URL" ]     && printf -- '- **URL:** <%s>\n' "$URL"
          [ -n "$DEST" ]    && printf -- '- **Kamal destination:** `%s`\n' "$DEST"
          [ -n "$DB_NAME" ] && printf -- '- **Database:** `%s`\n' "$DB_NAME"
          printf -- '- **Workflow run:** [%s](%s/%s/actions/runs/%s)\n' "$RUN_ID" "$SERVER_URL" "$GH_REPO" "$RUN_ID"
          printf '\n<sub>Posted by [kamal-previews](https://github.com/web-ascender/github-actions-kamal-previews).</sub>\n'
        } > "$body_file"
        # `$(<file)` strips only the *final* trailing newline; interior
        # newlines are preserved, which is what we need.
        body="$(<"$body_file")"
        rm -f "$body_file"

        # Find existing comment by marker
        existing_id="$(gh api -H 'Accept: application/vnd.github+json' \
          "/repos/$GH_REPO/issues/$pr_number/comments" --paginate \
          --jq "[.[] | select(.body | startswith(\"$MARKER\"))][0].id")"

        if [ -n "$existing_id" ] && [ "$existing_id" != "null" ]; then
          gh api --method PATCH "/repos/$GH_REPO/issues/comments/$existing_id" \
            -f body="$body" >/dev/null
          echo "Updated comment $existing_id."
        else
          gh api --method POST "/repos/$GH_REPO/issues/$pr_number/comments" \
            -f body="$body" >/dev/null
          echo "Created new PR comment on PR #$pr_number."
        fi
